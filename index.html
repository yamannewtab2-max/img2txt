<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image → Text</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#252a34; --fg:#e8eaf0; --dim:#8b93a7; --acc:#3b82f6; --ok:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 14px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .dim { color:var(--dim); font-size:12px; }
  main { padding:14px; max-width:900px; margin:0 auto; }
  button, select, label.btn {
    background:var(--card); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; padding:9px 13px; font-size:14px; font-weight:500; cursor:pointer;
  }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.45; cursor:default; }
  #pick { background:var(--acc); border-color:var(--acc); color:#fff; }
  #drop { border:1.5px dashed var(--line); border-radius:14px; padding:26px 14px; text-align:center; color:var(--dim); margin:12px 0; }
  #drop.hot { border-color:var(--acc); color:var(--fg); }
  #bar { height:6px; background:var(--card); border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  #bar > i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
  #status { font-size:12px; color:var(--dim); display:flex; justify-content:space-between; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 0; overflow:hidden; }
  .card .head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .card .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card pre { margin:0; padding:12px; white-space:pre-wrap; word-break:break-word; font:14px/1.6 ui-monospace,Menlo,Consolas,monospace; max-height:340px; overflow:auto; }
  .sub { background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--fg); }
  .mini { font-size:12px; color:var(--dim); }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Image → Text</h1>
    <span class="dim" id="net">offline-ready · runs in your browser</span>
  </div>
  <div class="row" style="margin-top:8px">
    <label class="btn" for="file">Choose images</label>
    <input id="file" type="file" accept="image/*,application/pdf" multiple class="hide">
    <select id="lang" title="Language">
      <option value="ara+eng" selected>Arabic + English</option>
      <option value="ara">Arabic</option>
      <option value="eng">English / Indonesian</option>
      <option value="eng+ind">English + Indonesian</option>
    </select>
    <button id="run" disabled>Start</button>
    <button id="dl" disabled>Download all</button>
    <button id="clear" disabled>Clear</button>
    <span class="mini" id="count"></span>
  </div>
</header>

<main>
  <div id="drop">Drop files here, or tap “Choose images”</div>
  <div id="prog" class="hide">
    <div id="bar"><i></i></div>
    <div id="status"><span id="cur"></span><span id="pct"></span></div>
  </div>
  <div id="out"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let files = [], results = [], worker = null, busy = false;

const fmt = n => n.toLocaleString('en-US');
const pick = f => (/^image\//.test(f.type) || /\.(png|jpe?g|webp|bmp|tiff?|pdf)$/i.test(f.name));

function addFiles(list) {
  const add = [...list].filter(pick);
  for (const f of add) if (!files.some(x => x.name === f.name && x.size === f.size)) files.push(f);
  refresh();
}
function refresh() {
  $('#count').textContent = files.length ? files.length + ' file' + (files.length > 1 ? 's' : '') : '';
  $('#run').disabled = !files.length || busy;
  $('#clear').disabled = busy || (!files.length && !results.length);
  $('#dl').disabled = !results.length;
}

// ---------- file input / drop ----------
$('#file').addEventListener('change', e => addFiles(e.target.files));
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
drop.addEventListener('click', () => $('#file').click());
document.addEventListener('drop', e => e.preventDefault());

// ---------- OCR ----------
async function getWorker(langs) {
  if (worker) { await worker.terminate(); worker = null; }
  $('#net').textContent = 'loading OCR engine…';
  worker = await Tesseract.createWorker(langs, 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0',
    langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    logger: m => {
      if (m.status === 'recognizing text') setPct(Math.round((i0 + m.progress) / total * 100), 'page ' + (i + 1) + '/' + total);
      else if (m.status) $('#net').textContent = m.status + (m.progress ? ' ' + Math.round(m.progress * 100) + '%' : '');
    }
  });
  await worker.setParameters({ preserve_interword_spaces: '1' });
  $('#net').textContent = 'engine ready · ' + langs;
  return worker;
}
let i = 0, i0 = 0, total = 0;
function setPct(p, label) { $('#bar > i').style.width = Math.max(0, Math.min(100, p)) + '%'; $('#pct').textContent = p + '%'; if (label) $('#cur').textContent = label; }

$('#run').addEventListener('click', async () => {
  if (busy || !files.length) return;
  busy = true; refresh();
  $('#prog').classList.remove('hide');
  const langs = $('#lang').value;
  total = files.length;
  try {
    await getWorker(langs);
  } catch (e) {
    $('#net').textContent = 'engine failed to load: ' + e.message;
    busy = false; refresh(); return;
  }
  for (i = 0; i < files.length; i++) {
    const f = files[i];
    i0 = i;
    setPct(Math.round(i / total * 100), f.name);
    let text = '', conf = 0;
    try {
      const { data } = await worker.recognize(f);
      text = (data.text || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
      conf = Math.round(data.confidence || 0);
    } catch (e) { text = ''; }
    results.push({ name: f.name, text, conf });
    renderCard(results.length - 1);
    setPct(Math.round((i + 1) / total * 100));
  }
  busy = false;
  $('#net').textContent = 'done · ' + results.length + ' pages';
  $('#cur').textContent = 'finished';
  refresh();
});

// ---------- output ----------
function renderCard(idx) {
  const r = results[idx];
  const words = r.text ? r.text.split(/\s+/).length : 0;
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<div class="head"><span class="name"></span>' +
    '<span class="row" style="gap:6px"><span class="mini">' + fmt(words) + ' words · ' + r.conf + '%</span>' +
    '<button class="sub copy">Copy</button><button class="sub save">.txt</button></span></div>' +
    '<pre dir="auto"></pre>';
  el.querySelector('.name').textContent = (idx + 1) + '. ' + r.name;
  el.querySelector('pre').textContent = r.text || '(no text found — try rotating the page or another language)';
  el.querySelector('.copy').onclick = async ev => {
    await navigator.clipboard.writeText(r.text);
    ev.target.textContent = 'Copied';
    setTimeout(() => ev.target.textContent = 'Copy', 800);
  };
  el.querySelector('.save').onclick = () => save(r.name.replace(/\.[^.]+$/, '') + '.txt', r.text);
  $('#out').appendChild(el);
}
function save(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#dl').addEventListener('click', () => {
  const all = results.map((r, n) => '===== ' + (n + 1) + '/' + results.length + '  ' + r.name + ' =====\n' + r.text).join('\n\n');
  save('ocr-all.txt', all);
});
$('#clear').addEventListener('click', async () => {
  files = []; results = []; $('#out').innerHTML = ''; $('#prog').classList.add('hide');
  setPct(0, ''); $('#net').textContent = 'offline-ready · runs in your browser';
  if (worker) { await worker.terminate(); worker = null; }
  refresh();
});
refresh();
</script>
</body>
</html>
